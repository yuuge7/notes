name: notes
description: "Local-first notes for Android."
publish_to: 'none'
# Only the major version is read from here. Each push to main is released as
# the next vMAJOR.MINOR after the tags already on GitHub (see "Releases and
# versioning" in README.md).
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animations: ^3.0.0
  collection: ^1.19.1
  drift: ^2.34.4
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  fonts:
    # Note content. Reading face, variable weight (opsz, wght).
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    # Interface. Grotesk, variable weight (wght).
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    # Meta only: timestamps, group headers, counts (wdth, wght).
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono.ttf
